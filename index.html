<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Dziennik treningowy</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dziennik"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>body{margin:0;background:#0b1020;color:#f3f4f6;font:15px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 16px 90px}h1{font-size:25px;margin:0 0 6px}h2{font-size:19px}p,small{color:#aeb8c9}button,input,select{font:inherit}button{background:#334155;border:1px solid #52617a;border-radius:10px;color:white;padding:11px;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}button.danger{background:#7f1d1d}input,select{background:#111827;color:white;border:1px solid #4b5563;border-radius:8px;padding:9px;min-width:0;box-sizing:border-box}input[type=number]{width:100%}.card{background:#182235;border:1px solid #344155;border-radius:15px;padding:15px;margin:12px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.tabs button.active{background:#2563eb}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:36px 1fr 1fr 38px;gap:7px;align-items:center;margin:8px 0}.muted{color:#9ca3af;font-size:12px}.exercise-title{font-size:16px;font-weight:700;overflow-wrap:anywhere}.stack{display:grid;gap:9px}.hidden{display:none}textarea{width:100%;height:100px;background:#111827;color:white;border:1px solid #4b5563;border-radius:8px}hr{border:0;border-top:1px solid #334155;margin:16px 0}.pill{font-size:12px;color:#bfdbfe}.editname{flex:1;min-width:140px}button.small{padding:7px 9px;font-size:13px}.warning{background:#422006;padding:10px;border-radius:8px;color:#fde68a;font-size:13px}</style></head><body><main><h1>🏋️ Dziennik treningowy</h1><p>Twój plan, serie i pełna historia treningów.</p><div class="tabs"><button id="tab-train" onclick="tab('train')">Trening</button><button id="tab-plan" onclick="tab('plan')">Edytuj plan</button><button id="tab-history" onclick="tab('history')">Historia</button></div><div id="view"></div></main><script>
const original=[{name:'dzień 1 góra',ex:[['wyciskanie sztangi na ławce poziomej',3],['podciąganie z obciążeniem',4],['wyciskanie hantli na ławce skośnej',3],['wiosłowanie ze sztangą',4],['dipy z obciązeniem',3],['wznosy',5]]},{name:'dzień 2 dół',ex:[['przysiad ze sztangą',4],['martwy ciąg na prostych nogach',3],['prostowanie nóg na maszynie',4],['ugninanie ramion hantlami',3],['ugnanie ramion ze sztangą nachwytem',3]]},{name:'dzien 3 góra',ex:[['wyciskanie hantli na ławce poziomej',3],['plecy na maszynie',4],['wyciskanie sztangi w siedzeniu',3],['plecy na wyciągu',4],['klatka na maszynie',3],['odwrotne rozpiętki',4],['wznosy',5],['triceps',3]]},{name:'dzień 4 dół',ex:[['martwy ciąg',4],['bułgary:',3],['hack squad:',3],['biceps na wyciągu',3],['biceps na modlitewniku',3]]}];
const key='dziennik_treningowy_v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.plan)||!Array.isArray(state.history)){state={plan:original.map((d,i)=>({id:'d'+i,name:d.name,ex:d.ex.map((e,j)=>({id:'e'+i+'_'+j,name:e[0],sets:e[1]}))})),history:[],draft:null};}let current='train',day=0;const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random();function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tab(t){current=t;for(const n of ['train','plan','history'])$('tab-'+n).classList.toggle('active',n===t);render()}function render(){({train:renderTrain,plan:renderPlan,history:renderHistory})[current]()}function selectDay(i){day=Number(i);render()}function daySelector(){return `<select onchange="selectDay(this.value)">${state.plan.map((d,i)=>`<option value="${i}" ${day===i?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`}function lastResult(id){for(let i=state.history.length-1;i>=0;i--){let e=state.history[i].ex.find(e=>e.id===id);if(e)return e}return null}
function start(){if(state.draft&&!confirm('Zastąpić niezakończony trening nowym?'))return;let d=state.plan[day];state.draft={id:uid(),dayId:d.id,dayName:d.name,date:new Date().toISOString(),ex:d.ex.map(e=>({id:e.id,name:e.name,sets:Array.from({length:e.sets},()=>({kg:'',reps:''}))}))};save();render()}function setField(e,s,f,val){state.draft.ex[e].sets[s][f]=val;save()}function addSet(e){state.draft.ex[e].sets.push({kg:'',reps:''});save();render()}function removeSet(e,s){state.draft.ex[e].sets.splice(s,1);save();render()}function finish(){if(!confirm('Zapisać ten trening w historii?'))return;state.history.push(JSON.parse(JSON.stringify({...state.draft,completedAt:new Date().toISOString()})));state.draft=null;save();render()}function discard(){if(confirm('Usunąć rozpoczęty trening?')){state.draft=null;save();render()}}
function renderTrain(){let d=state.draft;let out=`<div class="row between">${daySelector()}${d?'<span class="pill">Trening w toku</span>':''}</div>`;if(!d){out+=`<div class="card"><h2>Rozpocznij trening</h2><p>Wybierz dzień i wpisz ciężar oraz powtórzenia każdej serii.</p><button class="primary" onclick="start()">Rozpocznij</button></div>`}else{out+=`<p>Rozpoczęto: ${new Date(d.date).toLocaleString('pl-PL')} · ${esc(d.dayName)}</p>`;d.ex.forEach((e,i)=>{let prev=lastResult(e.id);out+=`<div class="card"><div class="exercise-title">${esc(e.name)}</div>${prev?`<p class="muted">Poprzednio: ${prev.sets.map(s=>`${esc(s.kg||'–')} kg × ${esc(s.reps||'–')}`).join(' | ')}</p>`:'<p class="muted">Brak wcześniejszych wyników</p>'}<div class="grid muted"><span>Nr</span><span>Ciężar (kg)</span><span>Powt.</span><span></span></div>`;e.sets.forEach((s,j)=>out+=`<div class="grid"><span>${j+1}</span><input type="number" inputmode="decimal" step="0.5" min="0" value="${esc(s.kg)}" oninput="setField(${i},${j},'kg',this.value)"><input type="number" inputmode="numeric" min="0" step="1" value="${esc(s.reps)}" oninput="setField(${i},${j},'reps',this.value)"><button class="small" onclick="removeSet(${i},${j})">×</button></div>`);out+=`<button class="small" onclick="addSet(${i})">+ Seria</button></div>`});out+=`<div class="row"><button class="primary" onclick="finish()">Zapisz trening</button><button class="danger" onclick="discard()">Odrzuć</button></div>`}$('view').innerHTML=out}
function renameDay(v){state.plan[day].name=v;save()}function editEx(i,field,val){state.plan[day].ex[i][field]=field==='sets'?Math.max(1,Number(val)||1):val;save()}function addEx(){state.plan[day].ex.push({id:uid(),name:'nowe ćwiczenie',sets:3});save();render()}function deleteEx(i){if(confirm('Usunąć ćwiczenie z planu? Historia pozostanie zachowana.')){state.plan[day].ex.splice(i,1);save();render()}}function renderPlan(){let d=state.plan[day];$('view').innerHTML=`<div class="row">${daySelector()}</div><div class="card"><label>Nazwa dnia</label><input style="width:100%;margin:8px 0" value="${esc(d.name)}" onchange="renameDay(this.value)"><p class="muted">Zmiany planu nie usuwają historii wcześniejszych treningów.</p></div>${d.ex.map((e,i)=>`<div class="card row"><input class="editname" aria-label="Nazwa ćwiczenia" value="${esc(e.name)}" onchange="editEx(${i},'name',this.value)"><input aria-label="Liczba serii" title="Liczba serii" type="number" min="1" style="width:65px" value="${e.sets}" onchange="editEx(${i},'sets',this.value)"><button class="danger small" onclick="deleteEx(${i})">Usuń</button></div>`).join('')}<button class="primary" onclick="addEx()">+ Dodaj ćwiczenie</button>`}
function deleteHistory(i){if(confirm('Na pewno usunąć ten zapisany trening?')){state.history.splice(i,1);save();render()}}function renderHistory(){let out=`<div class="row between"><h2>Historia (${state.history.length})</h2><button class="small" onclick="exportData()">Eksport JSON</button></div><div class="row"><label class="small">Import kopii:</label><input type="file" accept="application/json" onchange="importData(this.files[0])"></div><p class="warning">Dane są przechowywane lokalnie w tej przeglądarce. Regularnie eksportuj kopię JSON — wyczyszczenie danych przeglądarki lub zmiana telefonu może usunąć lokalną historię.</p>`;state.history.slice().reverse().forEach((h,k)=>{let i=state.history.length-1-k;out+=`<details class="card"><summary><b>${esc(h.dayName)}</b> · ${new Date(h.date).toLocaleString('pl-PL')}</summary>${h.ex.map(e=>`<p><b>${esc(e.name)}</b><br><span class="muted">${e.sets.map(s=>`${esc(s.kg||'–')} kg × ${esc(s.reps||'–')}`).join(' | ')}</span></p>`).join('')}<button class="danger small" onclick="deleteHistory(${i})">Usuń ten trening</button></details>`});if(!state.history.length)out+='<p>Nie masz jeszcze zapisanych treningów.</p>';$('view').innerHTML=out}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dziennik-treningowy-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.plan)||!Array.isArray(x.history))throw Error('Nieprawidłowy format');if(confirm('Import zastąpi aktualne dane. Kontynuować?')){state=x;save();day=0;render()}}catch(e){alert('Nie udało się odczytać kopii: '+e.message)}}tab('train');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
